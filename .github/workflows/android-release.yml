name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, lint, and build release APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "launch-ad-skip-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: launch-ad-skip-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
          body: |
            Debug-signed APK for personal sideloading.

            This build is not intended for app-store distribution. Accessibility-based launch-ad detection is best-effort and cannot guarantee coverage for every app or ad SDK.
